<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Responsive</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
		}
		table {
			width: 100%;
			height: 100%;
			border-collapse: collapse;
			table-layout: fixed;
		}
		td {
			width: 50%;
			height: 150px;
			text-align: left;
			vertical-align: middle;
            font-size: 1.5em;
			padding: 10px;
		}
		.first {
			background-color: green;
		}
		.second {
			background-color: pink;
		}
	</style>
</head>
<body>
	<table>
		<tr>
			<td class="first">Green</td>
			<td class="second">Pink</td>
		</tr>
	</table>
</body>
</html>
